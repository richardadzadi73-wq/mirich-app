<script>
const SUPABASE_URL="https://sexrdxsnouupwmebyzzv.supabase.co";
const SUPABASE_KEY="sb_publishable_MtSPrZA-U18niimiu5_1NQ_4ngmSj6H";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=JSON.parse(localStorage.getItem('michat_me')||'null'), currentChatName='General', postPhoto='', storyPhoto='', isRecording=false, recorder=null, audioChunks=[], curEmojiCat='smile';
const EMOJI={smile:"😀😁😂🤣😊😍😘😎🤔😅😭😡🥰😇🤩😜😝😋🤗🙏👍👎👏🙌💪🔥❤️💔✨🎉🥳😴🤯🥺😢😤😈👀💯".split(/(?:\p{Extended_Pictographic}|\p{Emoji})/u).filter(Boolean),
animal:"🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🙈🙉🙊🐔🐧🐦🐤🦄🐝🦋🐢🐙🦀🐬🦈🐘🦒🦓🐎🐄".split(/(?:\p{Extended_Pictographic})/u).filter(Boolean),
food:"🍎🍌🍇🍓🍕🍔🍟🌭🍿🍩🍪🍰🎂🍫🍦🍜🍣🍚🥤🧃☕🍵🍺🥂🍷🥭🍍🥑🌽🍞🧀🥚🍳".split(/(?:\p{Extended_Pictographic})/u).filter(Boolean),

travel:"✈️🚗🚕🚌🚲🚀🚢🏖️🏔️🗽🗼🏰🌍🌎🌏🇬🇭🇳🇬🇺🇸🇬🇧🇫🇷🇩🇪🇮🇹🇨🇦🇿🇦🇰🇪".split(/(?:\p{Extended_Pictographic})/u).filter(Boolean),
object:"💡📱💻⌚📷🎧📚✏️🔑🔒💰💎👑🎁💄👓👔👗👟🧢💼🎒📦🕯️🛒".split(/(?:\p{Extended_Pictographic})/u).filter(Boolean),
symbol:"❤️🧡💛💚💙💜🖤🤍💔💯✨⭐🌟🔥💥⚡🌈☀️🌙⭐💫🎉🎊🙏✌️🤞🤟👋".split(/(?:\p{Extended_Pictographic})/u).filter(Boolean)};
const STICKERS=["🔥","😂","🥰","😎","🙏","🇬🇭","⚽","🎉","💪","❤️","👑","🦁","🐐","💯","✨","🌍","🎤","📸","😭","🤣","🥳","😇"];
const GIFS=[["Happy Dance","💃 Happy vibes"],["Ghana Jollof","🍚 Jollof is life"],["Big Laugh","😂 Can't stop"],["Love You","❤️ Sending love"],["Congrats","🎉 Well done!"],["Good Morning","☀️ Morning Kumasi"],["Football Goal","⚽ GOOAL!"],["Prayer","🙏 God bless you"]];
function toggleEmoji(){ let p=document.getElementById('emojiPanel'); p.classList.toggle('hidden'); document.getElementById('emojiBtn').classList.toggle('active'); if(!p.classList.contains('hidden')) renderEmoji(); }
function emojiTab(cat){ curEmojiCat=cat; document.querySelectorAll('#emojiTabs button').forEach(b=>b.classList.remove('on')); event.target.classList.add('on'); renderEmoji(); }
function renderEmoji(){ let g=document.getElementById('emojiGrid'), s=document.getElementById('stickerGrid'), gf=document.getElementById('gifGrid'); g.classList.add('hidden'); s.classList.add('hidden'); gf.classList.add('hidden'); if(curEmojiCat==='sticker'){ s.classList.remove('hidden'); s.innerHTML=STICKERS.map(e=>`<div onclick="sendSticker('${e}')">${e}<div style='font-size:11px;color:#8696a0'>Sticker</div></div>`).join(''); return; } if(curEmojiCat==='gif'){ gf.classList.remove('hidden'); gf.innerHTML=GIFS.map(x=>`<div onclick="sendGif('${x[0]}')"><div style='font-size:36px'>🎞️</div><b>${x[0]}</b><p>${x[1]}</p></div>`).join(''); return; } g.classList.remove('hidden'); let q=(document.getElementById('emojiSearch').value||'').toLowerCase(); let list=EMOJI[curEmojiCat]||EMOJI.smile; if(q){ list=Object.values(EMOJI).flat().filter(e=>e); } g.innerHTML=list.map(e=>`<span onclick="insertEmoji('${e}')">${e}</span>`).join(''); }
function filterEmoji(){ if(curEmojiCat==='sticker'||curEmojiCat==='gif') return; renderEmoji(); }
function insertEmoji(e){ let inp=document.getElementById('msgInput'); inp.value+=e; inp.focus(); }
async function sendSticker(e){ await supabaseClient.from('messages').insert([{chat_name:currentChatName,sender:me.name,sender_name:me.name,text:'⭐ STICKER: '+e}]); toggleEmoji(); loadMessages(); }
async function sendGif(name){ await supabaseClient.from('messages').insert([{chat_name:currentChatName,sender:me.name,sender_name:me.name,text:'🎞️ GIF: '+name+' [GIF]'}]); toggleEmoji(); loadMessages(); }
async function checkDb(){ let {error}=await supabaseClient.from('profiles').select('id').limit(1); document.getElementById('dbStatus').textContent=error?error.message:'Connected ✓'; } checkDb();
if(me){ document.getElementById('loginView').classList.add('hidden'); document.getElementById('chatsView').classList.remove('hidden'); updateMeUI(); loadAll(); subscribe(); }
function updateMeUI(){ if(!me) return; document.getElementById('meLine').textContent=me.name+' • '+me.phone; document.getElementById('pName').textContent=me.name; document.getElementById('pPhone').textContent=(me.handle||'')+' • '+(me.phone||''); document.getElementById('pBio').textContent=me.bio||''; document.getElementById('pAva').textContent=me.name[0].toUpperCase(); if(me.avatar){ document.getElementById('pImg').src=me.avatar; document.getElementById('pImg').style.display='block'; document.getElementById('pAva').style.display='none'; } }
function fileToBase64(f){ return new Promise(res=>{ let r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); }); }
async function signup(){ let name=document.getElementById('myName').value.trim(), phone=document.getElementById('myPhone').value.trim(), handle=document.getElementById('myHandle').value.trim(); if(!name||!phone) return alert('Enter name + phone'); let {data,error}=await supabaseClient.from('profiles').insert([{name,phone,handle,bio:'Building Michat in Kumasi | God first | Hard work pays'}]).select().single(); if(error) return alert(error.message); me=data; localStorage.setItem('michat_me',JSON.stringify(me)); updateMeUI(); show('chatsView'); loadAll(); subscribe(); }
function loadAll(){ loadUsers(); loadChats(); loadFeed(); loadStories(); }
async function loadUsers(){ let {data}=await supabaseClient.from('profiles').select('*').order('created_at',{ascending:false}).limit(30); let el=document.getElementById('userList'); if(!data?.length){ el.innerHTML='<p class="small" style="padding:14px">No users yet.</p>'; return; } let q=(document.getElementById('searchUser')?.value||'').toLowerCase(); let f=data.filter(u=>!q||u.name.toLowerCase().includes(q)); el.innerHTML='<div style="padding:8px 14px"><b>People ('+f.length+')</b></div>'+f.filter(u=>u.id!==me?.id).map(u=>`<div class="row" onclick="openChat('${u.name.replace(/'/g,"")}')">${u.avatar?`<img class="ava" src="${u.avatar}">`:`<div class="ava">${u.name[0].toUpperCase()}</div>`}<div style="flex:1"><b>${u.name}</b><br><span class="small">${u.phone||''}</span></div><span class="dot"></span></div>`).join(''); }
async function loadChats(){ let {data}=await supabaseClient.from('messages').select('*').order('created_at',{ascending:false}).limit(40); let el=document.getElementById('chatList'); if(!data?.length){ el.innerHTML='<div class="card"><b>General Chat</b><button class="btn" style="margin-top:8px" onclick="openChat(\'General\')">Open →</button></div>'; return; } let uniq={}; data.forEach(m=>{ if(!uniq[m.chat_name]) uniq[m.chat_name]=m; }); el.innerHTML=Object.values(uniq).map(m=>`<div class="row" onclick="openChat('${m.chat_name}')"><div class="ava">${(m.chat_name||'G')[0]}</div><div style="flex:1"><b>${m.chat_name}</b><br><span class="small">${m.sender_name||m.sender}: ${m.text?m.text.slice(0,40):'📷 Photo / Voice'}</span></div></div>`).join(''); }
async function openChat(n){ currentChatName=n; document.getElementById('roomName').textContent=n; document.getElementById('roomAva').textContent=n[0].toUpperCase(); show('roomView'); loadMessages(); }
async function loadMessages(){ let {data}=await supabaseClient.from('messages').select('*').eq('chat_name',currentChatName).order('created_at',{ascending:true}).limit(100); let box=document.getElementById('msgs'); if(!data?.length){ box.innerHTML='<p style="text-align:center;padding:30px" class="small">No messages yet. Tap 😊 for emoji, stickers & GIFs.</p>'; return; } box.innerHTML=data.map(m=>{ let c=m.text||''; if(m.image_url?.startsWith('data:audio')) c+=`<audio controls src="${m.image_url}"></audio>`; else if(m.image_url?.startsWith('data:image')) c+=`<img class="chatImg" src="${m.image_url}">`; return `<div class="bubble ${m.sender===me?.name?'me':'other'}">${m.sender!==me?.name?`<b style="font-size:12px;color:#00a884">${m.sender_name||m.sender}</b><br>`:''}${c}<div class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${m.sender===me?.name?'✓✓':''}</div></div>`; }).join(''); }
async function sendMsg(){ let t=document.getElementById('msgInput').value.trim(); if(!t) return; document.getElementById('msgInput').value=''; document.getElementById('emojiPanel').classList.add('hidden'); await supabaseClient.from('messages').insert([{chat_name:currentChatName,sender:me.name,sender_name:me.name,text:t}]); loadMessages(); }
async function sendPhoto(e){ let f=e.target.files[0]; if(!f) return; if(f.size>900000) return alert('Photo too big — pick smaller (<1MB)'); let b64=await fileToBase64(f); await supabaseClient.from('messages').insert([{chat_name:currentChatName,sender:me.name,sender_name:me.name,text:'',image_url:b64}]); loadMessages(); }
async function toggleVoice(){ if(!isRecording){ try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); recorder=new MediaRecorder(s); audioChunks=[]; recorder.ondataavailable=e=>audioChunks.push(e.data); recorder.onstop=async()=>{ let blob=new Blob(audioChunks,{type:'audio/webm'}); let b64=await new Promise(res=>{ let r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); }); await supabaseClient.from('messages').insert([{chat_name:currentChatName,sender:me.name,sender_name:me.name,text:'',image_url:b64}]); loadMessages(); }; recorder.start(); isRecording=true; document.getElementById('micBtn').classList.add('rec'); document.getElementById('msgInput').placeholder='🔴 Recording… tap mic to stop'; }catch{ alert('Allow mic permission'); } } else { recorder.stop(); isRecording=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('msgInput').placeholder='Type a message…'; } }
async function createPost(){ let t=document.getElementById('postText').value.trim(); if(!t && !postPhoto) return; await supabaseClient.from('posts').insert([{author:me.name,text:t,image_url:postPhoto||null}]); document.getElementById('postText').value=''; postPhoto=''; document.getElementById('postPreview').style.display='none'; loadFeed(); }
async function previewPostPhoto(e){ let f=e.target.files[0]; if(!f) return; postPhoto=await fileToBase64(f); let p=document.getElementById('postPreview'); p.src=postPhoto; p.style.display='block'; }
async function loadFeed(){ let {data}=await supabaseClient.from('posts').select('*').order('created_at',{ascending:false}).limit(30); let el=document.getElementById('feedList'); if(!data?.length){ el.innerHTML='<p class="small" style="padding:14px">No posts yet.</p>'; return; } el.innerHTML=data.map(p=>`<div class="card"><b>${p.author}</b> <span class="small">• ${new Date(p.created_at).toLocaleString()}</span><p style="margin-top:8px">${p.text||''}</p>${p.image_url?`<img src="${p.image_url}" style="width:100%;border-radius:10px;margin-top:8px">`:''}<div style="margin-top:10px"><button class="btn2" onclick="likePost('${p.id}',${p.likes||0})">❤️ ${p.likes||0}</button></div></div>`).join(''); }
async function likePost(id,l){ await supabaseClient.from('posts').update({likes:l+1}).eq('id',id); loadFeed(); }
async function previewStoryPhoto(e){ let f=e.target.files[0]; if(!f) return; storyPhoto=await fileToBase64(f); let p=document.getElementById('storyPreview'); p.src=storyPhoto; p.style.display='block'; }
async function createStory(){ let t=document.getElementById('storyText').value.trim(); if(!t && !storyPhoto) return; await supabaseClient.from('stories').insert([{author:me.name,text:t,image_url:storyPhoto||null}]); document.getElementById('storyText').value=''; storyPhoto=''; document.getElementById('storyPreview').style.display='none'; loadStories(); alert('Story posted!'); }
async function loadStories(){ let {data}=await supabaseClient.from('stories').select('*').order('created_at',{ascending:false}).limit(30); let now=new Date(); let valid=(data||[]).filter(s=>(now-new Date(s.created_at))<24*60*60*1000); let row=document.getElementById('storyRow'); let list=document.getElementById('storyList'); row.innerHTML=`<div class="story" onclick="show('storiesView')"><div class="ava" style="border:2px dashed #8696a0">+</div><div class="small">Add</div></div>`+valid.map(s=>`<div class="story" onclick="show('storiesView')"><div class="ava">${s.author[0].toUpperCase()}</div><div class="small">${s.author.split(' ')[0]}</div></div>`).join(''); if(list) list.innerHTML=valid.length?valid.map(s=>`<div class="card"><b>${s.author}</b> <span class="small">• Expires 24h</span><p style="margin-top:8px">${s.text||''}</p>${s.image_url?`<img src="${s.image_url}" style="width:100%;border-radius:10px;margin-top:8px">`:''}</div>`).join(''):'<p class="small" style="padding:14px">No stories in 24h.</p>'; }
async function updateProfilePhoto(e){ let f=e.target.files[0]; if(!f) return; let b64=await fileToBase64(f); await supabaseClient.from('profiles').update({avatar:b64}).eq('id',me.id); me.avatar=b64; localStorage.setItem('michat_me',JSON.stringify(me)); updateMeUI(); alert('Profile photo saved ✓'); }
async function updateBio(){ let b=document.getElementById('editBio').value.trim(); if(!b) return; await supabaseClient.from('profiles').update({bio:b}).eq('id',me.id); me.bio=b; localStorage.setItem('michat_me',JSON.stringify(me)); updateMeUI(); alert('Bio saved'); }
async function startCall(){ await supabaseClient.from('calls').insert([{caller:me.name,receiver:currentChatName,type:'voice',status:'missed'}]); alert('Call logged'); }
function subscribe(){ supabaseClient.channel('michat-v56').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>{ if(!document.getElementById('roomView').classList.contains('hidden')) loadMessages(); loadChats(); }).on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>loadFeed()).on('postgres_changes',{event:'INSERT',schema:'public',table:'stories'},()=>loadStories()).subscribe(); }
function show(id){ ['loginView','chatsView','roomView','feedView','storiesView','profileView'].forEach(v=>document.getElementById(v).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.getElementById('emojiPanel').classList.add('hidden'); document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on')); if(id==='chatsView'){ document.getElementById('tChats').classList.add('on'); loadAll(); } if(id==='feedView'){ document.getElementById('tFeed').classList.add('on'); loadFeed(); } if(id==='storiesView'){ document.getElementById('tStories').classList.add('on'); loadStories(); } if(id==='profileView') document.getElementById('tProfile').classList.add('on'); }
function fabAction(){ let n=prompt('Who to chat with?'); if(n) openChat(n); }
function logout(){ localStorage.removeItem('michat_me'); location.reload(); }
</script></body></html>
