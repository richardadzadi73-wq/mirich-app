<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Michat</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#0f0f0f;
color:#fff;
}
button{
border:none;
cursor:pointer;
}
input{
outline:none;
border:none;
}
/* LOGIN - BLUE LIKE OLD */
#loginPage{
min-height:100vh;
background:#0a1aff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:24px;
text-align:center;
}
.loginLogo{
width:110px;
height:110px;
background:#000;
border-radius:28px;
display:flex;
align-items:center;
justify-content:center;
font-size:64px;
margin-bottom:14px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.loginTitle{
font-size:52px;
font-weight:900;
letter-spacing:3px;
color:#fff;
}
.loginSub{
font-size:12px;
letter-spacing:3px;
color:#dbe0ff;
margin-top:4px;
margin-bottom:28px;
}
.loginBtn{
width:100%;
max-width:360px;
padding:16px;
border-radius:999px;
font-size:19px;
font-weight:700;
margin-bottom:12px;
color:#fff;
}
.btnDark{
background:#1a1a1a;
}
.btnBrown{
background:#7a2e00;
}
.loginLink{
margin-top:8px;
font-size:17px;
font-weight:700;
color:#fff;
}
.loginLink span{
color:#ffeb00;
text-decoration:underline;
}
.loginFoot{
margin-top:18px;
font-size:11px;
color:#c9ceff;
letter-spacing:1px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="loginLogo">M</div>
<div class="loginTitle">MICHAT</div>
<div class="loginSub">
PRIVATE MESSAGING • SECURE • v53
</div>
<input id="authName"
placeholder="Your name e.g. Richard"
style="width:100%;max-width:360px;
padding:14px;border-radius:999px;
margin-bottom:12px;font-size:16px;">
<button class="loginBtn btnDark"
onclick="doLogin()">Continue with Google</button>
<button class="loginBtn btnDark"
onclick="doLogin()">Use Phone Number</button>
<button class="loginBtn btnDark"
onclick="doLogin()">Use Email</button>
<button class="loginBtn btnBrown"
onclick="doLogin()">Sign Up</button>
<div class="loginLink">
Already have an account? <span>Log in</span>
</div>
<div class="loginFoot">
MICHAT • SECURE • PRIVATE
</div>
</div>
<!-- SETTINGS MAIN -->
<div id="settingsPage"
style="display:none;position:fixed;inset:0;
background:#121212;color:#fff;z-index:200;
overflow-y:auto;padding-bottom:80px;">
<div style="padding:16px;display:flex;
align-items:center;gap:12px;">
<button onclick="closeSettings()"
style="background:none;color:#fff;
font-size:24px;">‹</button>
<b style="font-size:24px;">Settings ⚙️</b>
</div>
<div style="padding:0 16px 8px;
font-size:13px;color:#aaa;">
Gear = Main Settings only.
Inside chat use : dots.
</div>
<div id="settingsList"></div>
</div>

<!-- SETTINGS DETAIL -->
<div id="settingDetail"
style="display:none;position:fixed;inset:0;
background:#121212;color:#fff;z-index:210;
overflow-y:auto;padding-bottom:80px;">
<div style="padding:16px;display:flex;
align-items:center;gap:12px;">
<button onclick="closeDetail()"
style="background:none;color:#fff;
font-size:24px;">←</button>
<b id="detailTitle"
style="font-size:24px;">Account</b>
</div>
<div id="detailBody"
style="padding:0 8px;"></div>
</div>

<script>
let S = {
name:'Richard',
about:'Available',
lastSeen:'Everyone',
read:'On',
enterSend:false,
mediaVis:true,
fontSize:'Medium',
notif:true,
convTone:true,
remind:true,
highPri:true,
reactions:true,
lessData:false,
proxy:'Off',
uploadQ:'Standard quality',
autoQ:'Auto'
};
let settingsItems = [
{t:'Account',s:'Profile, name, photo',k:'account'},
{t:'Privacy',s:'Blocked, last seen, read receipts',k:'privacy'},
{t:'Lists',s:'Broadcast lists',k:'lists'},
{t:'Chats',s:'Wallpaper, backup',k:'chats'},
{t:'Broadcasts',s:'Send to many',k:'broadcast'},
{t:'Events',s:'Create event',k:'events'},
{t:'Notifications',s:'Sounds, alerts',k:'notif'},
{t:'Storage',s:'Manage storage',k:'storage'}
];
function renderSettings(){
let box = document.getElementById('settingsList');
box.innerHTML = '';
settingsItems.forEach(function(it){
let d = document.createElement('div');
d.style.cssText = 'display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #222;cursor:pointer;';
d.onclick = function(){ openDetail(it.k); };
d.innerHTML = '<span style="font-size:20px;">⚙️</span><div style="flex:1;"><b style="font-size:18px;">'+it.t+'</b><div style="color:#aaa;font-size:14px;">'+it.s+'</div></div><span style="color:#888;">›</span>';
box.appendChild(d);
});
}
function toggle(key,el){
S[key] = !S[key];
el.style.background = S[key] ? '#00c853' : '#555';
el.textContent = S[key] ? '✓' : '—';
showToast(key + ' : ' + (S[key] ? 'ON' : 'OFF'));
}
function tRow(label,sub,key){
let on = S[key];
let bg = on ? '#00c853' : '#555';
let tx = on ? '✓' : '—';
return '<div style="display:flex;gap:12px;padding:16px;align-items:center;">' +
'<div style="flex:1;"><b style="font-size:18px;">'+label+'</b>' +
'<div style="color:#888;font-size:14px;">'+sub+'</div></div>' +
'<button onclick="toggle(\''+key+'\',this)" style="width:52px;height:30px;border-radius:999px;background:'+bg+';color:#fff;font-size:16px;">'+tx+'</button></div>';
}
function row(label,sub){
return '<div style="padding:14px 16px;border-bottom:1px solid #1e1e1e;"><b style="font-size:18px;">'+label+'</b><div style="color:#888;font-size:14px;">'+sub+'</div></div>';
}
function openDetail(k){
document.getElementById('settingsPage').style.display = 'block';
document.getElementById('settingDetail').style.display = 'block';
let titles = {account:'Account',privacy:'Privacy',lists:'Lists',chats:'Chats',broadcast:'Broadcasts',events:'Events',notif:'Notifications',storage:'Storage and data'};
document.getElementById('detailTitle').textContent = titles[k];
let b = document.getElementById('detailBody');
if(k === 'account'){
b.innerHTML = row('Name',S.name + ' — tap to change') + row('About',S.about) + row('Phone','+233 ... — Verified') + '<div style="padding:16px;"><button onclick="let n=prompt(\'New name\',S.name);if(n){S.name=n;showToast(\'Name saved\');openDetail(\'account\');}" style="width:100%;padding:14px;border-radius:999px;background:#0a1aff;color:#fff;font-weight:700;">Edit Profile</button></div>';
}
if(k === 'privacy'){
b.innerHTML = row('Last seen',S.lastSeen) + row('Read receipts',S.read) + row('Blocked','0 contacts blocked') + '<div style="padding:16px;"><button onclick="S.lastSeen=S.lastSeen===\'Everyone\'?\'Nobody\':\'Everyone\';showToast(\'Last seen: \'+S.lastSeen);openDetail(\'privacy\');" style="width:100%;padding:14px;border-radius:999px;background:#222;color:#fff;">Toggle Last Seen: '+S.lastSeen+'</button></div>';
}
if(k === 'lists'){
b.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;">Any list you create becomes a filter at the top of your Chats tab.</div><div style="padding:0 16px;"><button onclick="let n=prompt(\'List name\');if(n){showToast(\'List \'+n+\' created\');}" style="width:100%;padding:14px;border-radius:999px;background:#0b3d2e;color:#7dffb0;font-weight:700;">+ Create a custom list</button></div>' + row('Unread','Preset') + row('Favourites','Add people or groups') + row('Groups','Preset');
}
if(k === 'chats'){
b.innerHTML = '<div style="color:#888;padding:8px 16px;">Chat settings</div>' + tRow('Enter is send','Enter key will send your message','enterSend') + tRow('Media visibility','Show newly downloaded media in gallery','mediaVis') + row('Font size',S.fontSize) + row('Default reactions','❤️ 👍 😂') + row('Voice message transcripts','Read new voice messages') + tRow('Sticker suggestions','See suggested stickers as you type','mediaVis');
}
if(k === 'broadcast'){
b.innerHTML = row('New Broadcast','Send to many at once') + '<div style="padding:16px;"><button onclick="showToast(\'Broadcast created\')" style="width:100%;padding:14px;border-radius:999px;background:#0a1aff;color:#fff;font-weight:700;">+ New Broadcast</button></div>';
}
if(k === 'events'){
b.innerHTML = row('Create Event','Plan with friends') + '<div style="padding:16px;"><button onclick="let e=prompt(\'Event name\');if(e){showToast(\'Event \'+e+\' created\');}" style="width:100%;padding:14px;border-radius:999px;background:#7a2e00;color:#fff;font-weight:700;">+ Create Event</button></div>';
}
if(k === 'notif'){
b.innerHTML = tRow('Conversation tones','Play sounds for incoming and outgoing','convTone') + tRow('Reminders','Get reminders about unseen messages','remind') + row('Notification tone','Default (Brightline)') + row('Vibrate','Default') + row('Light','White') + tRow('Use high priority notifications','Show previews at top of screen','highPri') + tRow('Reactions','Show notifications when you get likes','reactions');
}
if(k === 'storage'){
b.innerHTML = row('Manage storage','79.2 MB') + row('Network usage','56.1 MB sent • 938.2 MB received') + tRow('Use less data for calls','Save data on calls','lessData') + row('Proxy',S.proxy) + row('Media upload quality',S.uploadQ) + row('Auto-download quality',S.autoQ) + row('When using mobile data','Photos') + row('When connected on Wi-Fi','All media') + row('When roaming','No media');
}
}
function openSettings(){
document.getElementById('settingsPage').style.display = 'block';
renderSettings();
}
function closeSettings(){
document.getElementById('settingsPage').style.display = 'none';
document.getElementById('settingDetail').style.display = 'none';
}
function closeDetail(){
document.getElementById('settingDetail').style.display = 'none';
}
function showToast(m){
let old = document.getElementById('toast');
if(!old){
let d = document.createElement('div');
d.id = 'toast';
d.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;z-index:999;font-size:14px;';
document.body.appendChild(d);
old = d;
}
old.textContent = m;
old.style.display = 'block';
setTimeout(function(){ old.style.display = 'none'; },2000);
}
renderSettings();
</script>
<style>
/* THIN LINE ICONS */
.tBtn{
background:#1a1a1a !important;
font-weight:300 !important;
}
.bTab div{
font-weight:300 !important;
}
.thin{
font-weight:200;
stroke-width:1;
}
</style>
<script>
/* TOP BAR - THIN */
let tops = document.querySelectorAll('.topIcons .tBtn');
if(tops[0]) tops[0].innerHTML = '<span style="font-weight:200;">⌕</span>';
if(tops[1]) tops[1].innerHTML = '<span style="font-weight:200;">⚙</span>';
if(tops[2]) tops[2].innerHTML = '<span style="font-weight:200;">+</span>';
/* BOTTOM TABS - THIN LINE */
document.getElementById('bt-chats').innerHTML =
'<div style="font-size:22px;font-weight:200;">◐</div>Chats';
document.getElementById('bt-feed').innerHTML =
'<div style="font-size:22px;font-weight:200;">▭</div>Feed';
document.getElementById('bt-story').innerHTML =
'<div style="font-size:22px;font-weight:200;">◯</div>Story';
document.getElementById('bt-calls').innerHTML =
'<div style="font-size:22px;font-weight:200;">☏</div>Calls';
document.getElementById('bt-profile').innerHTML =
'<div style="font-size:22px;font-weight:200;">○</div>Profile';
/* FAB - THIN */
let fab = document.querySelector('.fabBrown');
if(fab) fab.innerHTML = '<span style="font-weight:200;">+</span>';
/* SEARCH ICON - THIN */
let sb = document.querySelector('.searchBox');
if(sb){
sb.innerHTML = '<span style="font-weight:200;">⌕</span>' +
'<input id="searchInp" placeholder="Search" oninput="doSearch(this.value)">';
}
</script>
<script>
function aiReply(q){
let s = q.toLowerCase();
if(s.includes('hi') || s.includes('hello')){
return 'Hello ' + myName + '!\nHow can I help you today?\nMaths? Code? Pidgin? Twi?';
}
if(s.includes('who are you')){
return 'I am Mirich AI\nBuilt inside Michat by Richard.\nI can do Maths, Code, Captions, Translate, Pidgin, Twi!';
}
if(s.includes('pidgin')){
return 'Pidgin mode ON\nHow far? You dey?\nTell me wetin you want make I do.';
}
if(s.includes('twi') || s.includes('maakye')){
return 'Maakye!\nMe ye Mirich AI.\nEte sen? Tell me what you need.';
}
if(s.includes('caption')){
return 'Caption idea:\n"Small wins, big dreams. Still rising."\nWant another one?';
}
if(s.includes('code') || s.includes('html')){
return 'Code tip:\nUse short lines in GitHub.\nLong lines break files.\nWant me to write code for you?';
}
if(s.includes('maths') || s.includes('math') || s.includes('+')){
try{
let expr = q.replace(/[^0-9+\-*/(). ]/g,'');
if(expr.trim() !== ''){
let ans = eval(expr);
return 'Maths Answer\n' + expr + ' = ' + ans;
}
}catch(e){}
return 'Send me a maths question like:\n12 + 8 * 2';
}
if(s.includes('love')){
return 'Send her this:\n"You make my ordinary days feel special."';
}
if(s.includes('joke')){
return 'Joke:\nWhy did the phone go to school?\nTo get smarter... like me!';
}
if(s.includes('thank')){
return 'You are welcome ' + myName + '\nAnything else?';
}
if(s.includes('image') || s.includes('picture')){
return 'Image idea:\nA Ghana boy in Kumasi, sunset, Michat hoodie.\nDescribe it and I will write a prompt!';
}
if(s.includes('translate')){
return 'Translate mode\nType: translate hello to Twi\nI will do it!';
}
if(s.includes('hello') && s.includes('twi')){
return 'Hello in Twi = Maakye (morning) / Maaha (afternoon)';
}
return 'I hear you: "' + q + '"\n\nI can help with:\n- Maths\n- Code\n- Captions\n- Pidgin / Twi\n- Jokes / Love messages\n\nTry: "Tell me a joke"';
}
</script>
</body>
</html>
